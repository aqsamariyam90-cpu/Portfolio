<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div id="loginPage" class="login-page">

        <div class="login-box">

            <h1>Admin Login</h1>

            <p>Login to access the Admin Panel</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </div>


    <div id="adminPage" class="admin-container">

        <div class="admin-header">

            <h1>Admin Panel</h1>

            <div>
                <a href="index.html" class="back-btn">
                    Back to Portfolio
                </a>

                <button id="logoutBtn">
                    Logout
                </button>
            </div>

        </div>


        <div class="admin-stats">

            <div class="stat-card">

                <h3>Total Messages</h3>

                <p id="totalMessages">0</p>

            </div>


            <div class="stat-card">

                <h3>Storage Status</h3>

                <p>Active</p>

            </div>

        </div>


        <div class="messages-section">

            <div class="section-header">

                <div>
                    <h2>Contact Messages</h2>
                    <p>Messages saved in localStorage</p>
                </div>

                <button id="clearMessages">
                    Clear All
                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Subject</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="messageTable"></tbody>

                </table>

            </div>


            <p id="emptyMessage">
                No messages found.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
